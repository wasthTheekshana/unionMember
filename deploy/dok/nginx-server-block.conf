# Union Members (samithiya) - server blocks for the SHARED nginx on the DOK server.
#
# Paste both blocks into  ~/dok-stack/nginx/nginx.conf  (inside the http { } section,
# before the default catch-all block). The domain is union.testsys.shop.
# nginx reaches the app by container name over the shared-nginx Docker network.
#
# Then:
#   cd ~/dok-stack
#   docker compose exec nginx nginx -t
#   docker compose exec nginx nginx -s reload

# samithiya - HTTP redirect
server {
    listen 80;
    server_name union.testsys.shop;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# samithiya - HTTPS
server {
    listen 443 ssl;
    server_name union.testsys.shop;
    ssl_certificate     /etc/letsencrypt/live/union.testsys.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/union.testsys.shop/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ /\.env { deny all; return 404; }

    # The app container serves both the API (/api) and the web pages.
    location / {
        proxy_pass         http://samithiya-app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}

# OPTIONAL extra brake on password guessing at the proxy (the app already locks a
# username out after 5 failures). It needs one line in the http { } section of
# ~/dok-stack/nginx/nginx.conf, outside any server block:
#
#   limit_req_zone $binary_remote_addr zone=samithiya_login:10m rate=10r/m;
#
