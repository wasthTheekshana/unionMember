# Union Members Management - nginx site config
#
# Serves the built React frontend as static files and proxies /api to the
# PM2-managed backend (union-members-backend, port 5003).
#
# Install:
#   sudo cp deploy/nginx-union-members.conf /etc/nginx/sites-available/union-members
#   sudo ln -s /etc/nginx/sites-available/union-members /etc/nginx/sites-enabled/union-members
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8083;
    server_name 192.168.2.199;

    root /home/UnionMangementSystem/frontend/dist;
    index index.html;

    # React Router (client-side routing) - fall back to index.html for
    # any path that isn't a real file/asset.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://localhost:5003/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
